name: Nightly dependency update

# `cargo update` within the semver ranges (and in fuzz/), then the full gate; if
# it is green, commit the lockfiles straight to main as `chore(deps)`. Nothing
# changed ⇒ nothing happens. Releases stay manual (`just release X.Y.Z`).

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC (Gitea runs at 02:30)
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# Never cancel mid-run: a half-finished push would leave main inconsistent.
concurrency:
  group: deps-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Install system packages
        run: nu scripts/ci/apt.nu
      - name: cargo update
        run: nu scripts/ci/deps_update.nu update
      - name: Anything to do?
        id: diff
        run: nu scripts/ci/deps_update.nu changed >> "$GITHUB_OUTPUT"
      - name: Quality gate
        if: steps.diff.outputs.changed == 'true'
        run: nu scripts/ci/quality_gate.nu
      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: nu scripts/ci/deps_update.nu commit "github-actions[bot]" "41898282+github-actions[bot]@users.noreply.github.com"
