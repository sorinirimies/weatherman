name: Nightly Dependency Update

# Upgrades workspace dependencies every night, and — only if a real
# dependency version actually changed — auto-merges the bump and dispatches
# a patch release. A dependency downgrade or any change outside
# Cargo.toml/Cargo.lock aborts the workflow before anything is committed.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-dependency-update
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update libraries and auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system deps (Iced)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      # `cargo upgrade`'s recursive-dep resolver runs in offline mode and only
      # considers package sources physically present in the local cache.
      # `cargo update && cargo fetch` refreshes the index and downloads
      # sources first so the offline phase always has a valid, non-yanked
      # candidate for every transitive dependency.
      - name: Pre-warm cargo registry (refresh index + fetch sources)
        run: cargo update && cargo fetch

      - name: Upgrade workspace dependency pins
        id: upgrade
        run: |
          set -o pipefail
          cargo upgrade --workspace --incompatible allow 2>&1 | tee /tmp/upgrade.log
          cargo update --verbose 2>&1 | tee -a /tmp/upgrade.log

      # `cargo update`/`cargo upgrade` should only ever move dependency
      # versions forward. If the registry index/cache is stale they can
      # silently pick an older version than what's already pinned — abort
      # before anything is committed if that ever happens.
      - name: Guard against dependency downgrades
        run: |
          if grep -q "Downgrading " /tmp/upgrade.log; then
            echo "❌ Dependency downgrade detected — aborting without committing:"
            grep "Downgrading " /tmp/upgrade.log
            git checkout -- Cargo.toml Cargo.lock
            exit 1
          fi
          echo "✅ No dependency downgrades detected."

      # cargo-edit can touch source/example files in rare cases (e.g. via
      # build scripts) — reject anything outside the two dependency files so
      # a nightly run can never smuggle in unreviewed source changes.
      - name: Reject non-library changes
        run: |
          if ! git diff --quiet -- . ':(exclude)Cargo.toml' ':(exclude)Cargo.lock'; then
            echo "Nightly update changed files other than Cargo.toml/Cargo.lock:"
            git diff --name-only
            exit 1
          fi

      - name: Build updated dependency set
        run: cargo build --locked --workspace --all-features --all-targets

      - name: Run tests
        run: cargo test --workspace --all-features

      # `cargo upgrade` (cargo-edit) reserializes the whole Cargo.toml via
      # toml_edit — it can reorder/reformat keys and whitespace even when no
      # dependency version actually changed. Cargo.lock is the ground truth:
      # it only changes when a resolved dependency version actually moves.
      # Gate on Cargo.lock only; Cargo.toml is still committed alongside it.
      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update dependency pull request
        id: create-pr
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          add-paths: |
            Cargo.toml
            Cargo.lock
          commit-message: "chore(deps): nightly library update"
          title: "chore(deps): nightly library update"
          body: |
            Automated nightly library update.

            - Direct dependency requirements upgraded to latest releases
            - Lockfile refreshed
            - Dependency downgrades rejected
            - Formatting, Clippy, tests, and build passed

            This workflow merges the validated PR and explicitly dispatches
            the patch-release workflow.
          branch: chore/nightly-dependency-update
          delete-branch: true

      - name: Merge validated dependency pull request
        id: merge-pr
        if: steps.create-pr.outputs.pull-request-operation == 'created' || steps.create-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          state=$(gh pr view "$PR_NUMBER" --json state --jq '.state')
          if [ "$state" != "MERGED" ]; then
            echo "Dependency PR was not merged; refusing to release."
            exit 1
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch patch release
        if: steps.merge-pr.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run auto-release.yml --ref "$BASE_BRANCH" -f branch="$BASE_BRANCH"
