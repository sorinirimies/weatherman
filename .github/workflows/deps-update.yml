name: Nightly dependency update

# `cargo update` within the semver ranges (and in fuzz/), then the full gate; if
# it is green, commit the lockfiles straight to main as `chore(deps)`. Nothing
# changed ⇒ nothing happens. Releases stay manual (`just release X.Y.Z`).

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC (Gitea runs at 02:30)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write # merge green Dependabot PRs
  issues: write # open an issue when the nightly fails

env:
  CARGO_TERM_COLOR: always

# Never cancel mid-run: a half-finished push would leave main inconsistent.
concurrency:
  group: deps-update
  cancel-in-progress: false

jobs:
  # Dependabot PRs CI passed on, majors included (scripts/ci/auto_merge.nu): catches
  # the ones auto-merge.yml did not merge, e.g. CI ran before it existed.
  dependabot:
    name: Merge green Dependabot PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Merge green Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: nu scripts/ci/auto_merge.nu sweep

  # After the merges, so this checks out (and pushes onto) the newest main.
  update:
    needs: dependabot
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Install system packages
        run: nu scripts/ci/apt.nu
      - name: cargo update
        run: nu scripts/ci/deps_update.nu update
      - name: Anything to do?
        id: diff
        run: nu scripts/ci/deps_update.nu changed >> "$GITHUB_OUTPUT"
      - name: Quality gate
        if: steps.diff.outputs.changed == 'true'
        run: nu scripts/ci/quality_gate.nu
      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: nu scripts/ci/deps_update.nu commit "github-actions[bot]" "41898282+github-actions[bot]@users.noreply.github.com"

  # A red nightly (expired token, broken gate) must be seen the same day: open one
  # issue per failing run history, comment on it while it stays red.
  notify-failure:
    needs: [dependabot, update]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly dependency update is failing"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Failed again: $url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The scheduled run failed: $url"$'\n\nCheck the step log; \`could not read Username\` means the GH_PAT secret is expired or invalid.'
          fi
