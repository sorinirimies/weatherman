# cargo-deny configuration: `cargo deny check`
[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # Pre-existing; tracked for follow-up (rustls update pending).
    "RUSTSEC-2026-0346", # rustls: Debug impls expose TLS secrets
    "RUSTSEC-2026-0347", # rustls: buffered data after ECH rejection
    "RUSTSEC-2026-0348", # rustls: brotli cert decompression alloc
    "RUSTSEC-2026-0349", # rustls: ServerHello downgrade
    "RUSTSEC-2024-0436", # paste unmaintained (transitive via iced/wgpu stack)
    "RUSTSEC-2026-0192", # ttf-parser unmaintained (transitive via iced/cosmic-text)
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    "WTFPL",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
