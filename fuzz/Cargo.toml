[package]
name = "weatherman-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
chrono = "0.4"
serde_json = "1"
weatherman-core = { path = "../crates/weatherman-core" }

# Not part of the main workspace (needs nightly).
[workspace]

[[bin]]
name = "settings_json"
path = "fuzz_targets/settings_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "local_time"
path = "fuzz_targets/local_time.rs"
test = false
doc = false
bench = false
